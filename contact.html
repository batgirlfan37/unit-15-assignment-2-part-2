<h2 class="center2">Want to get in contact with the Swaffham Swifts?</h2>
<h3 class="c">email us below!</h3>
<br>

<div class="contact">
<form id="contactForm">
<label for="name">Name:</label>
 
        <input type="text" id="name" name="name" autocomplete="name" />
 
        <br>
        <br>

        <label for="email">Email address:</label>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        />
 
        <br>
        <br>

        <label for="message">Message:</label>
 
        <textarea
          id="message"
          name="message"
          autocomplete="off"
          required
></textarea

          <br>
